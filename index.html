<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThymeToEat - End Dinner Indecision</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons for UI Polish -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    },
                    animation: {
                        'pop-in': 'popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                    },
                    keyframes: {
                        popIn: {
                            '0%': { opacity: '0', transform: 'scale(0.9) translateY(10px)' },
                            '100%': { opacity: '1', transform: 'scale(1) translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans antialiased">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-brand-500 text-white p-2.5 rounded-2xl shadow-md shadow-brand-500/20">
                    <i class="fa-solid fa-utensils text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-brand-600 to-emerald-700 bg-clip-text text-transparent leading-tight">ThymeToEat</h1>
                    <p class="text-xs text-slate-500 font-medium">No more dinner indecision</p>
                </div>
            </div>
            <span class="text-xs font-semibold px-3 py-1 bg-brand-50 text-brand-700 rounded-full border border-brand-100 hidden sm:inline-block">
                <i class="fa-solid fa-bolt mr-1"></i> Quick Decider
            </span>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-8 space-y-8">

        <!-- Controls Section -->
        <section class="bg-white rounded-3xl p-6 sm:p-8 shadow-xl shadow-slate-200/50 border border-slate-100">
            <div class="mb-6">
                <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-brand-500"></i> What are you craving?
                </h2>
                <p class="text-sm text-slate-500 mt-1">Set your preferences or leave them as "Any" for a surprise twist.</p>
            </div>

            <!-- Filters Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                <!-- Cuisine Filter -->
                <div class="space-y-1.5">
                    <label for="cuisineSelect" class="block text-xs font-bold uppercase tracking-wider text-slate-500">Cuisine</label>
                    <div class="relative">
                        <select id="cuisineSelect" class="w-full appearance-none bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 pr-10 text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all cursor-pointer">
                            <option value="Any">Any Cuisine</option>
                            <option value="Asian">Asian</option>
                            <option value="Western">Western</option>
                            <option value="Mediterranean">Mediterranean</option>
                            <option value="Mexican">Mexican</option>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
                    </div>
                </div>

                <!-- Protein Filter -->
                <div class="space-y-1.5">
                    <label for="proteinSelect" class="block text-xs font-bold uppercase tracking-wider text-slate-500">Protein</label>
                    <div class="relative">
                        <select id="proteinSelect" class="w-full appearance-none bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 pr-10 text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all cursor-pointer">
                            <option value="Any">Any Protein</option>
                            <option value="Chicken">Chicken</option>
                            <option value="Beef">Beef</option>
                            <option value="Pork">Pork</option>
                            <option value="Fish/Seafood">Fish / Seafood</option>
                            <option value="Vegetarian/Tofu">Vegetarian / Tofu</option>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
                    </div>
                </div>

                <!-- Base Style Filter -->
                <div class="space-y-1.5">
                    <label for="styleSelect" class="block text-xs font-bold uppercase tracking-wider text-slate-500">Base Style</label>
                    <div class="relative">
                        <select id="styleSelect" class="w-full appearance-none bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 pr-10 text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all cursor-pointer">
                            <option value="Any">Any Style</option>
                            <option value="Noodles">Noodles</option>
                            <option value="Rice">Rice</option>
                            <option value="Pasta">Pasta</option>
                            <option value="Soup">Soup</option>
                            <option value="Sandwich/Wrap">Sandwich / Wrap</option>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row items-center gap-3">
                <button id="findMealBtn" class="w-full sm:flex-1 bg-brand-600 hover:bg-brand-700 active:scale-[0.98] text-white font-semibold py-3.5 px-6 rounded-xl shadow-lg shadow-brand-500/30 transition-all duration-150 flex items-center justify-center gap-2 group cursor-pointer">
                    <i class="fa-solid fa-utensils group-hover:rotate-12 transition-transform"></i>
                    <span>Find Me a Meal</span>
                </button>
                <button id="surpriseBtn" class="w-full sm:w-auto bg-slate-100 hover:bg-slate-200 active:scale-[0.98] text-slate-700 font-semibold py-3.5 px-6 rounded-xl transition-all duration-150 flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-dice text-brand-600"></i>
                    <span>Surprise Me!</span>
                </button>
            </div>
        </section>

        <!-- Result Section Container -->
        <section id="resultContainer" class="relative">
            <!-- Populated dynamically by app.js -->
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-400 mt-auto">
        <p>© ThymeToEat. Powered by Vanilla JS & Tailwind CSS.</p>
    </footer>

    <!-- App Logic Script -->
    <script src="app.js"></script>
</body>
</html>
