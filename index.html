<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThymeToEat - End Dinner Indecision</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons for UI Polish -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    },
                    animation: {
                        'pop-in': 'popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                    },
                    keyframes: {
                        popIn: {
                            '0%': { opacity: '0', transform: 'scale(0.9) translateY(10px)' },
                            '100%': { opacity: '1', transform: 'scale(1) translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans antialiased relative">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-brand-500 text-white p-2.5 rounded-2xl shadow-md shadow-brand-500/20">
                    <i class="fa-solid fa-utensils text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-brand-600 to-emerald-700 bg-clip-text text-transparent leading-tight">ThymeToEat</h1>
                    <p class="text-xs text-slate-500 font-medium">No more dinner indecision</p>
                </div>
            </div>
            
            <!-- Quick Action Links -->
            <div class="flex items-center gap-2">
                <button id="viewFavoritesBtn" class="flex items-center gap-1.5 text-xs font-semibold px-3 py-2 bg-amber-50 text-amber-700 rounded-xl border border-amber-200 hover:bg-amber-100 transition-colors cursor-pointer">
                    <i class="fa-solid fa-star text-amber-500"></i>
                    <span>Starred (<span id="starredCount">0</span>)</span>
                </button>
                <button id="viewHistoryBtn" class="flex items-center gap-1.5 text-xs font-semibold px-3 py-2 bg-slate-100 text-slate-700 rounded-xl border border-slate-200 hover:bg-slate-200 transition-colors cursor-pointer">
                    <i class="fa-solid fa-clock-rotate-left text-slate-500"></i>
                    <span>Log (<span id="historyCount">0</span>)</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-8 space-y-8">

        <!-- Controls Section -->
        <section class="bg-white rounded-3xl p-6 sm:p-8 shadow-xl shadow-slate-200/50 border border-slate-100">
            <div class="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                <div>
                    <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                        <i class="fa-solid fa-sliders text-brand-500"></i> What are you craving?
                    </h2>
                    <p class="text-sm text-slate-500 mt-1">Pick a course & cuisine, or open advanced filters for specific cravings.</p>
                </div>
                <!-- Advanced Filters Toggle -->
                <button id="toggleAdvancedBtn" class="inline-flex items-center gap-2 text-xs font-bold text-brand-600 hover:text-brand-700 bg-brand-50 hover:bg-brand-100 px-3.5 py-2 rounded-xl transition-all cursor-pointer border border-brand-200/50 self-start sm:self-auto">
                    <i class="fa-solid fa-filter"></i>
                    <span>Advanced Filters</span>
                    <i id="advancedChevron" class="fa-solid fa-chevron-down text-[10px] transition-transform duration-200"></i>
                </button>
            </div>

            <!-- Primary Clean Filter Grid (Course & Cuisine Default) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                <!-- Course Filter -->
                <div class="space-y-1.5">
                    <label for="courseSelect" class="block text-xs font-bold uppercase tracking-wider text-slate-500">Course</label>
                    <div class="relative">
                        <select id="courseSelect" class="w-full appearance-none bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 pr-10 text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all cursor-pointer">
                            <option value="Any">Any Course</option>
                            <option value="Main Course">Main Course</option>
                            <option value="Dessert">Dessert</option>
                            <option value="Starter / Appetizer">Starter / Appetizer</option>
                            <option value="Snack">Snack</option>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
                    </div>
                </div>

                <!-- Cuisine Filter -->
                <div class="space-y-1.5">
                    <label for="cuisineSelect" class="block text-xs font-bold uppercase tracking-wider text-slate-500">Cuisine</label>
                    <div class="relative">
                        <select id="cuisineSelect" class="w-full appearance-none bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 pr-10 text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all cursor-pointer">
                            <option value="Any">Any Cuisine</option>
                            <option value="Asian">Asian</option>
                            <option value="Western">Western</option>
                            <option value="Mediterranean">Mediterranean</option>
                            <option value="Mexican">Mexican</option>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
                    </div>
                </div>
            </div>

            <!-- Collapsible Advanced Filters Section -->
            <div id="advancedFiltersPanel" class="hidden pt-2 pb-4 mb-4 border-t border-slate-100 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 animate-pop-in">
                <!-- Protein Filter -->
                <div class="space-y-1.5">
                    <label for="proteinSelect" class="block text-xs font-bold uppercase tracking-wider text-slate-500">Protein</label>
                    <div class="relative">
                        <select id="proteinSelect" class="w-full appearance-none bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 pr-10 text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all cursor-pointer">
                            <option value="Any">Any Protein</option>
                            <option value="Chicken">Chicken</option>
                            <option value="Beef">Beef</option>
                            <option value="Pork">Pork</option>
                            <option value="Fish/Seafood">Fish / Seafood</option>
                            <option value="Vegetarian/Tofu">Vegetarian / Tofu</option>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
                    </div>
                </div>

                <!-- Base Style Filter -->
                <div class="space-y-1.5">
                    <label for="styleSelect" class="block text-xs font-bold uppercase tracking-wider text-slate-500">Base Style</label>
                    <div class="relative">
                        <select id="styleSelect" class="w-full appearance-none bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 pr-10 text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all cursor-pointer">
                            <option value="Any">Any Style</option>
                            <option value="Noodles">Noodles</option>
                            <option value="Rice">Rice</option>
                            <option value="Pasta">Pasta</option>
                            <option value="Soup">Soup</option>
                            <option value="Sandwich/Wrap">Sandwich / Wrap</option>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
                    </div>
                </div>

                <!-- Difficulty Filter -->
                <div class="space-y-1.5">
                    <label for="difficultySelect" class="block text-xs font-bold uppercase tracking-wider text-slate-500">Difficulty</label>
                    <div class="relative">
                        <select id="difficultySelect" class="w-full appearance-none bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 pr-10 text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all cursor-pointer">
                            <option value="Any">Any Difficulty</option>
                            <option value="Easy">Easy</option>
                            <option value="Medium">Medium</option>
                            <option value="Hard">Hard</option>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
                    </div>
                </div>

                <!-- Mood / Vibe Filter -->
                <div class="space-y-1.5">
                    <label for="moodSelect" class="block text-xs font-bold uppercase tracking-wider text-slate-500">Mood / Vibe</label>
                    <div class="relative">
                        <select id="moodSelect" class="w-full appearance-none bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 pr-10 text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all cursor-pointer">
                            <option value="Any">Any Mood</option>
                            <option value="Quick & Lazy">Quick & Lazy</option>
                            <option value="Healthy & Clean">Healthy & Clean</option>
                            <option value="Comforting">Comforting</option>
                            <option value="Guilty Pleasure">Guilty Pleasure</option>
                            <option value="Spicy Kick">Spicy Kick</option>
                            <option value="Fresh & Light">Fresh & Light</option>
                            <option value="Date Night / Fancy">Date Night / Fancy</option>
                            <option value="Feast / Hungry">Feast / Hungry</option>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
                    </div>
                </div>
            </div>

            <!-- Primary Action Buttons -->
            <div class="flex flex-col sm:flex-row items-center gap-3">
                <button id="findMealBtn" class="w-full sm:flex-1 bg-brand-600 hover:bg-brand-700 active:scale-[0.98] text-white font-semibold py-3.5 px-6 rounded-xl shadow-lg shadow-brand-500/30 transition-all duration-150 flex items-center justify-center gap-2 group cursor-pointer">
                    <i class="fa-solid fa-utensils group-hover:rotate-12 transition-transform"></i>
                    <span>Find Me a Meal</span>
                </button>
                <button id="surpriseBtn" class="w-full sm:w-auto bg-slate-100 hover:bg-slate-200 active:scale-[0.98] text-slate-700 font-semibold py-3.5 px-6 rounded-xl transition-all duration-150 flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-dice text-brand-600"></i>
                    <span>Surprise Me!</span>
                </button>
            </div>
        </section>

        <!-- Result Section Container -->
        <section id="resultContainer" class="relative">
            <!-- Dynamic Recipe Content -->
        </section>
    </main>

    <!-- Slide-over Drawer Modal -->
    <div id="drawerOverlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 hidden transition-opacity"></div>
    <aside id="drawer" class="fixed top-0 right-0 h-full w-full max-w-md bg-white z-50 shadow-2xl flex flex-col translate-x-full transition-transform duration-300 ease-in-out">
        <div class="p-6 border-b border-slate-100 flex items-center justify-between">
            <h3 id="drawerTitle" class="text-lg font-bold text-slate-900 flex items-center gap-2">Modal View</h3>
            <button id="closeDrawerBtn" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center transition-colors cursor-pointer">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div id="drawerContent" class="flex-grow p-6 overflow-y-auto space-y-4">
            <!-- Populated via JS -->
        </div>
        <div id="drawerFooter" class="p-4 border-t border-slate-100 bg-slate-50">
            <!-- Action buttons populated via JS -->
        </div>
    </aside>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-400 mt-auto">
        <p>© ThymeToEat. Powered by Vanilla JS & Tailwind CSS.</p>
    </footer>

    <!-- App Logic Script -->
    <script src="app.js"></script>
</body>
</html>
