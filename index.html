<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThymeToEat - End Dinner Indecision</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    },
                    animation: {
                        'pop-in': 'popIn 400ms cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'spin-full': 'spin360 400ms ease-in-out forwards',
                        'toast-in': 'toastIn 300ms cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'toast-out': 'toastOut 300ms ease-in forwards',
                    },
                    keyframes: {
                        popIn: {
                            '0%': { opacity: '0', transform: 'translateY(8px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        spin360: {
                            '0%': { transform: 'rotate(0deg)' },
                            '100%': { transform: 'rotate(360deg)' }
                        },
                        toastIn: {
                            '0%': { opacity: '0', transform: 'translateX(20px) scale(0.95)' },
                            '100%': { opacity: '1', transform: 'translateX(0) scale(1)' }
                        },
                        toastOut: {
                            '0%': { opacity: '1', transform: 'translateX(0) scale(1)' },
                            '100%': { opacity: '0', transform: 'translateX(20px) scale(0.95)' }
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans antialiased">

    <!-- Floating Toast Notification System Container (Top-Right) -->
    <div id="toastContainer" class="fixed top-5 right-5 z-[60] pointer-events-none flex flex-col gap-2.5 items-end max-w-sm w-full px-4"></div>

    <!-- Sticky Centered Top Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm w-full">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-brand-500 text-white p-2 rounded-xl shadow-md shadow-brand-500/20 transition-transform hover:scale-105 duration-200">
                    <i class="fa-solid fa-utensils text-lg"></i>
                </div>
                <h1 class="text-lg font-bold bg-gradient-to-r from-brand-600 to-emerald-700 bg-clip-text text-transparent">ThymeToEat</h1>
            </div>
            
            <!-- Quick Action Badges (Starred, Log, Dislikes) -->
            <div class="flex items-center gap-2">
                <button id="viewFavoritesBtn" class="flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 bg-amber-50 text-amber-700 rounded-lg border border-amber-200 hover:bg-amber-100 active:scale-95 transition-all cursor-pointer">
                    <i class="fa-solid fa-star text-amber-500"></i>
                    <span>Starred (<span id="starredCount">0</span>)</span>
                </button>
                <button id="viewDislikesBtn" class="flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 bg-rose-50 text-rose-700 rounded-lg border border-rose-200 hover:bg-rose-100 active:scale-95 transition-all cursor-pointer">
                    <i class="fa-solid fa-thumbs-down text-rose-500"></i>
                    <span>Dislikes (<span id="dislikedCount">0</span>)</span>
                </button>
                <button id="viewHistoryBtn" class="flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 bg-slate-100 text-slate-700 rounded-lg border border-slate-200 hover:bg-slate-200 active:scale-95 transition-all cursor-pointer">
                    <i class="fa-solid fa-clock-rotate-left text-slate-500"></i>
                    <span>Log (<span id="historyCount">0</span>)</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Strictly Centered Main Layout Container -->
    <main class="flex-grow min-h-screen flex flex-col items-center justify-start py-8 px-4 max-w-4xl mx-auto w-full space-y-6">

        <!-- Primary Control Box (Inline Expandable) -->
        <section class="bg-white rounded-3xl p-6 sm:p-8 shadow-xl shadow-slate-200/50 border border-slate-100 w-full space-y-6">
            <div class="text-center">
                <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">What should we eat today?</h2>
                <p class="text-slate-500 text-xs sm:text-sm mt-1">Select a quick preference or let us pick a random meal!</p>
            </div>

            <!-- Primary 2 Dropdowns (Course & Cuisine) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label for="courseSelect" class="block text-[11px] font-bold uppercase tracking-wider text-slate-400">Course</label>
                    <select id="courseSelect" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-brand-500/20 cursor-pointer transition-colors">
                        <option value="Any">Any Course</option>
                        <option value="Main Course">Main Course</option>
                        <option value="Dessert">Dessert</option>
                        <option value="Starter / Appetizer">Starter / Appetizer</option>
                        <option value="Snack">Snack</option>
                    </select>
                </div>

                <div class="space-y-1">
                    <label for="cuisineSelect" class="block text-[11px] font-bold uppercase tracking-wider text-slate-400">Cuisine</label>
                    <select id="cuisineSelect" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-brand-500/20 cursor-pointer transition-colors">
                        <option value="Any">Any Cuisine</option>
                        <option value="Asian">Asian</option>
                        <option value="Western">Western</option>
                        <option value="Mediterranean">Mediterranean</option>
                        <option value="Mexican">Mexican</option>
                    </select>
                </div>
            </div>

            <!-- Inline Expandable Controls (Protein, Style, Difficulty, Mood) -->
            <div id="expandedFiltersPanel" class="hidden pt-4 border-t border-slate-100 grid grid-cols-1 sm:grid-cols-2 gap-4 animate-pop-in">
                <div class="space-y-1">
                    <label for="proteinSelect" class="block text-[11px] font-bold uppercase tracking-wider text-slate-400">Protein</label>
                    <select id="proteinSelect" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-brand-500/20 cursor-pointer transition-colors">
                        <option value="Any">Any Protein</option>
                        <option value="Chicken">Chicken</option>
                        <option value="Beef">Beef</option>
                        <option value="Pork">Pork</option>
                        <option value="Fish/Seafood">Fish / Seafood</option>
                        <option value="Vegetarian/Tofu">Vegetarian / Tofu</option>
                    </select>
                </div>

                <div class="space-y-1">
                    <label for="styleSelect" class="block text-[11px] font-bold uppercase tracking-wider text-slate-400">Base Style</label>
                    <select id="styleSelect" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-brand-500/20 cursor-pointer transition-colors">
                        <option value="Any">Any Style</option>
                        <option value="Rice">Rice</option>
                        <option value="Noodles">Noodles</option>
                        <option value="Pasta">Pasta</option>
                        <option value="Small Bites / Dim Sum">Small Bites / Dim Sum</option>
                        <option value="Roast / Barbecue Meat">Roast / Barbecue Meat</option>
                        <option value="Seafood Special">Seafood Special</option>
                        <option value="Baked / Cake">Baked / Cake</option>
                        <option value="Beverage / Dessert">Beverage / Dessert</option>
                        <option value="Sandwich/Wrap">Sandwich / Wrap</option>
                    </select>
                </div>

                <div class="space-y-1">
                    <label for="difficultySelect" class="block text-[11px] font-bold uppercase tracking-wider text-slate-400">Difficulty</label>
                    <select id="difficultySelect" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-brand-500/20 cursor-pointer transition-colors">
                        <option value="Any">Any Difficulty</option>
                        <option value="Easy">Easy</option>
                        <option value="Medium">Medium</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>

                <div class="space-y-1">
                    <label for="moodSelect" class="block text-[11px] font-bold uppercase tracking-wider text-slate-400">Mood / Vibe</label>
                    <select id="moodSelect" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-brand-500/20 cursor-pointer transition-colors">
                        <option value="Any">Any Mood</option>
                        <option value="Quick & Lazy">Quick & Lazy</option>
                        <option value="Healthy & Clean">Healthy & Clean</option>
                        <option value="Comforting">Comforting</option>
                        <option value="Guilty Pleasure">Guilty Pleasure</option>
                        <option value="Spicy Kick">Spicy Kick</option>
                        <option value="Fresh & Light">Fresh & Light</option>
                        <option value="Date Night / Fancy">Date Night / Fancy</option>
                        <option value="Feast / Hungry">Feast / Hungry</option>
                    </select>
                </div>
            </div>

            <!-- Action Buttons Container -->
            <div class="flex flex-col sm:flex-row items-center gap-3 pt-2">
                <button id="findMealBtn" class="w-full sm:flex-1 bg-brand-600 hover:bg-brand-700 active:scale-[0.98] text-white font-semibold py-3.5 px-6 rounded-xl shadow-lg shadow-brand-500/30 transition-all cursor-pointer flex items-center justify-center gap-2">
                    <i id="findMealIcon" class="fa-solid fa-utensils"></i>
                    <span>Find Me a Meal</span>
                </button>
                <button id="surpriseBtn" class="w-full sm:w-auto bg-slate-100 hover:bg-slate-200 active:scale-[0.98] text-slate-700 font-semibold py-3.5 px-6 rounded-xl transition-all flex items-center justify-center gap-2 cursor-pointer">
                    <i id="surpriseIcon" class="fa-solid fa-dice text-brand-600"></i>
                    <span>Surprise Me!</span>
                </button>
            </div>

            <!-- Custom Filter Toggle Button -->
            <div class="text-center pt-1">
                <button id="toggleInlineFiltersBtn" class="text-xs font-bold text-slate-400 hover:text-brand-600 transition-colors cursor-pointer flex items-center justify-center gap-1.5 mx-auto">
                    <i class="fa-solid fa-sliders"></i>
                    <span>Customize More (Protein, Style, Mood)</span>
                    <i id="chevronIcon" class="fa-solid fa-chevron-down text-[10px] transition-transform duration-200"></i>
                </button>
            </div>
        </section>

        <!-- Recipe Result Display Box -->
        <section id="resultContainer" class="w-full relative">
            <!-- Rendered dynamically -->
        </section>
    </main>

    <!-- Side Drawer Modal for Log, Starred, and Disliked Lists -->
    <div id="drawerOverlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 hidden transition-opacity"></div>
    <aside id="drawer" class="fixed top-0 right-0 h-full w-full max-w-md bg-white z-50 shadow-2xl flex flex-col translate-x-full transition-transform duration-300 ease-in-out">
        <div class="p-6 border-b border-slate-100 flex items-center justify-between">
            <h3 id="drawerTitle" class="text-lg font-bold text-slate-900">Modal View</h3>
            <button id="closeDrawerBtn" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 active:scale-90 flex items-center justify-center cursor-pointer transition-all">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div id="drawerContent" class="flex-grow p-6 overflow-y-auto space-y-3"></div>
        <div id="drawerFooter" class="p-4 border-t border-slate-100 bg-slate-50"></div>
    </aside>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-400 mt-auto w-full">
        <p>© ThymeToEat. Powered by Vanilla JS & Tailwind CSS.</p>
    </footer>

    <!-- App Logic Script -->
    <script src="app.js"></script>
</body>
</html>
